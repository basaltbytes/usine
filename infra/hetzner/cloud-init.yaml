#cloud-config
# A usine SSH Worker on Debian: the `usine` user with Git, gh, Node.js, pnpm,
# Claude Code, Codex, and Chromium, and SSH that admits only that user by key.
# create-worker.sh and `gateway/gateway.sh worker-user-data` replace
# "@AUTHORIZED_KEYS@" with the public keys to authorize, as a list. Behind the
# gateway, `worker-user-data` adds gateway/worker-cloud-init.yaml, which puts
# the forward proxy in /etc/environment for the setup script below.

disable_root: true
ssh_pwauth: false

users:
  - name: usine
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys: "@AUTHORIZED_KEYS@"

package_update: true
package_upgrade: true
packages:
  - build-essential
  - bubblewrap
  - ca-certificates
  - chromium
  - curl
  - git
  - gnupg
  - jq

# Swap lets the OOM killer end one process instead of the whole machine thrashing when an Attempt's gates run out of memory (#270).
swap:
  filename: /swapfile
  size: 2G

write_files:
  - path: /etc/ssh/sshd_config.d/10-usine.conf
    permissions: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      AllowUsers usine
  # Children run over non-interactive SSH, which reads this file and no shell profile.
  # Playwright does not read PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH; a project's test config passes it on, as usine's apps/web does.
  # All Attempts on the machine share the Turborepo cache, as they share pnpm's default store under the usine user's home.
  - path: /etc/environment
    append: true
    content: |
      DISABLE_AUTOUPDATER=1
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=/usr/bin/chromium
      TURBO_CACHE_DIR=/home/usine/.cache/turbo

  # Oxc reserves a 6 GiB virtual buffer at start, which the kernel's heuristic refuses on a machine with less memory plus swap (#270).
  - path: /etc/sysctl.d/90-usine-worker.conf
    permissions: "0644"
    content: |
      vm.overcommit_memory = 1

  # One script with set -e, so a failed step marks cloud-init as failed instead of being skipped over.
  - path: /usr/local/sbin/usine-worker-setup
    permissions: "0755"
    content: |
      #!/bin/sh
      set -eu
      # runcmd does not read /etc/environment; behind the gateway it contains the forward proxy.
      set -a
      . /etc/environment
      set +a
      install -d -m 0755 /etc/apt/keyrings
      curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /etc/apt/keyrings/githubcli-archive-keyring.gpg
      curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
      chmod 0644 /etc/apt/keyrings/githubcli-archive-keyring.gpg /etc/apt/keyrings/nodesource.gpg
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
      echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_24.x nodistro main" > /etc/apt/sources.list.d/nodesource.list
      apt-get update
      DEBIAN_FRONTEND=noninteractive apt-get install -y gh nodejs
      # Codex is pinned to a version usine's protocol conformance gate supports.
      npm install -g pnpm@11.20.0 @anthropic-ai/claude-code@2.1.296 @openai/codex@0.153.4
      # Applies the overcommit setting of /etc/sysctl.d now, not at the next boot.
      sysctl --system
      install -d -o usine -g usine -m 0700 /home/usine/.usine /home/usine/.cache /home/usine/.cache/turbo
      systemctl restart ssh

runcmd:
  - [/usr/local/sbin/usine-worker-setup]
