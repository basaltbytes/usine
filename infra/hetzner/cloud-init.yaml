#cloud-config
# A usine SSH Worker on Debian: the `usine` user with Git, gh, Node.js, pnpm,
# Claude Code, Codex, Chromium, and a container runtime, and SSH that admits only that user
# by key. Each attempt runs in its own container from the image
# of ../worker-image; the harnesses here serve the logins.
# For create-worker.sh, snapshot.sh, and `gateway/gateway.sh worker-user-data`,
# render-cloud-init.sh replaces "@AUTHORIZED_KEYS@" with the public keys to
# authorize, as a list, and @NODE_MAJOR@ with NODE_MAJOR of
# ../worker-image/Dockerfile, so the machine runs the attempt image's Node.js
# major version. Behind the gateway, `worker-user-data` adds
# gateway/worker-cloud-init.yaml, which puts the forward proxy in
# /etc/environment for the setup script below.

disable_root: true
ssh_pwauth: false

users:
  - name: usine
    groups: [systemd-journal]
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys: "@AUTHORIZED_KEYS@"

package_update: true
package_upgrade: true
packages:
  - build-essential
  - bubblewrap
  - ca-certificates
  - chromium
  - curl
  - git
  - gnupg
  - jq
  - nftables

# Swap lets the OOM killer end one process instead of the whole machine thrashing when an Attempt's gates run out of memory (#270).
swap:
  filename: /swapfile
  size: 2G

write_files:
  - path: /etc/usine/container-runtime
    permissions: "0644"
    content: |
      @CONTAINER_RUNTIME@

  - path: /etc/ssh/sshd_config.d/10-usine.conf
    permissions: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      AllowUsers usine
  # Children run over non-interactive SSH, which reads this file and no shell profile.
  # Playwright does not read PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH; a project's test config passes it on, as usine's apps/web does.
  # All Attempts on the machine share the Turborepo cache, as they share pnpm's default store under the usine user's home.
  - path: /etc/environment
    append: true
    content: |
      DISABLE_AUTOUPDATER=1
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=/usr/bin/chromium
      TURBO_CACHE_DIR=/home/usine/.cache/turbo

  # Behind the gateway, gateway/worker-cloud-init.yaml writes this file after this one, and its rules replace these.
  - path: /etc/nftables.conf
    permissions: "0644"
    content: |
      #!/usr/sbin/nft -f
      table inet usine_metadata
      delete table inet usine_metadata
      table inet usine_metadata {
      	chain output {
      		type filter hook output priority filter; policy accept;
      		# cloud-init reads the user data as root at boot; it has a provisioned server's SSH host private key, so no other user or container may.
      		ip daddr 169.254.169.254 meta skuid != 0 drop
      	}
      	# A bridged container has no uid on the host; nothing forwarded reaches the metadata service.
      	chain forward {
      		type filter hook forward priority -10; policy accept;
      		ip daddr 169.254.169.254 drop
      	}
      }

  # Oxc reserves a 6 GiB virtual buffer at start, which the kernel's heuristic refuses on a machine with less memory plus swap (#270).
  - path: /etc/sysctl.d/90-usine-worker.conf
    permissions: "0644"
    content: |
      vm.overcommit_memory = 1

  # One script with set -e, so a failed step marks cloud-init as failed instead of being skipped over.
  - path: /usr/local/sbin/usine-worker-setup
    permissions: "0755"
    content: |
      #!/bin/sh
      set -eu
      # runcmd does not read /etc/environment; behind the gateway it contains the forward proxy.
      set -a
      . /etc/environment
      set +a
      install -d -m 0755 /etc/apt/keyrings
      curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /etc/apt/keyrings/githubcli-archive-keyring.gpg
      curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
      chmod 0644 /etc/apt/keyrings/githubcli-archive-keyring.gpg /etc/apt/keyrings/nodesource.gpg
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
      echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_@NODE_MAJOR@.x nodistro main" > /etc/apt/sources.list.d/nodesource.list
      apt-get update
      DEBIAN_FRONTEND=noninteractive apt-get install -y gh nodejs
      # Generated by scripts/worker-image/generate.mjs; run pnpm worker-image:generate.
      npm install -g pnpm@11.20.0 @anthropic-ai/claude-code@2.1.311 @openai/codex@0.164.0
      # Applies the overcommit setting of /etc/sysctl.d now, not at the next boot.
      sysctl --system
      install -d -o usine -g usine -m 0700 /home/usine/.usine /home/usine/.cache /home/usine/.cache/turbo
      case "$(cat /etc/usine/container-runtime)" in
        podman)
          DEBIAN_FRONTEND=noninteractive apt-get install -y podman crun uidmap dbus-user-session libpam-systemd
          # useradd usually allocates these ranges. Allocate only when none exists.
          for kind in uid gid; do
            file=/etc/sub$kind
            touch "$file"
            if ! awk -F: '$1 == "usine" { found=1 } END { exit !found }' "$file"; then
              first=$(awk -F: 'BEGIN { next_id=100000 } { if ($2+$3 > next_id) next_id=$2+$3 } END { print next_id }' "$file")
              usermod "--add-sub${kind}s" "$first-$((first + 65535))" usine
            fi
          done
          if id -nG usine | tr ' ' '\n' | grep -qx docker; then gpasswd -d usine docker; fi
          rm -f /etc/systemd/system/docker.service.d/http-proxy.conf /etc/docker/daemon.json
          install -d -m 0755 /etc/systemd/system/user@.service.d /etc/containers/containers.conf.d
          printf '[Service]\nDelegate=cpu cpuset io memory pids\n' > /etc/systemd/system/user@.service.d/delegate.conf
          printf '[engine]\ncgroup_manager="systemd"\nruntime="crun"\n' > /etc/containers/containers.conf.d/90-usine.conf
          systemctl daemon-reload
          loginctl enable-linger usine
          systemctl restart "user@$(id -u usine).service"
          ;;
        docker)
          DEBIAN_FRONTEND=noninteractive apt-get install -y docker.io docker-cli
          usermod -aG docker usine
          if [ -f /usr/local/share/usine/docker-proxy.conf ]; then
            install -D -m 0644 /usr/local/share/usine/docker-proxy.conf /etc/systemd/system/docker.service.d/http-proxy.conf
            install -d -m 0755 /etc/docker
            printf '{"iptables":false,"ip6tables":false}\n' > /etc/docker/daemon.json
          fi
          systemctl daemon-reload
          systemctl enable docker
          systemctl restart docker
          ;;
        *) echo 'Unknown container runtime' >&2; exit 1 ;;
      esac
      systemctl enable --now nftables
      systemctl restart ssh

runcmd:
  - [/usr/local/sbin/usine-worker-setup]
