#!/usr/sbin/nft -f
# The usine orchestrator: new connections only from the tailnet, to SSH, and no
# forwarding. usine up listens on 127.0.0.1, and tailscaled answers the HTTPS
# port of tailscale serve itself. The orchestrator opens its own connections to
# GitHub, npm, the model providers, Tailscale, the gateway, its time server, and
# the Workers through the gateway, so the private network gets only the replies.

flush ruleset

table inet usine_orchestrator {
	chain input {
		type filter hook input priority filter; policy drop;
		iif lo accept
		ct state established,related accept
		ct state invalid drop
		meta l4proto { icmp, ipv6-icmp } accept
		iifname "tailscale0" tcp dport 22 accept
		# DHCP renewals for the private network address.
		udp sport 67 udp dport 68 accept
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}
}
