#!/usr/sbin/nft -f
# The usine orchestrator: SSH and the web UI port only from the tailnet and the
# private network, and no forwarding. The orchestrator opens its own
# connections to GitHub, npm, the model providers, Tailscale, the gateway, and
# the Workers through the gateway.

define network = 10.42.0.0/16
define ui_port = 7331

flush ruleset

table inet usine_orchestrator {
	chain input {
		type filter hook input priority filter; policy drop;
		iif lo accept
		ct state established,related accept
		ct state invalid drop
		meta l4proto { icmp, ipv6-icmp } accept
		iifname "tailscale0" tcp dport { 22, $ui_port } accept
		ip saddr $network tcp dport { 22, $ui_port } accept
		# DHCP renewals for the private network address.
		udp sport 67 udp dport 68 accept
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}
}
