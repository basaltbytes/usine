#!/usr/sbin/nft -f
# A Worker VM on the private network: it accepts SSH from the gateway only
# and opens connections to the gateway only, for DNS, time, the reverse proxy,
# and the forward proxy, and to the metadata service as root. The Worker has
# no public address, so these rules are the second barrier after the missing
# route.

define gateway = 10.42.0.2

flush ruleset

table inet usine_worker {
	chain input {
		type filter hook input priority filter; policy drop;
		iif lo accept
		ct state established,related accept
		ct state invalid drop
		ip saddr $gateway tcp dport 22 accept
		ip saddr $gateway icmp type echo-request accept
		# DHCP renewals for the private network address.
		udp sport 67 udp dport 68 accept
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy drop;
		oif lo accept
		ct state established,related accept
		ip daddr $gateway udp dport { 53, 123 } accept
		ip daddr $gateway tcp dport { 53, 80, 3128 } accept
		ip daddr $gateway icmp type echo-request accept
		udp sport 68 udp dport 67 accept
		# cloud-init reads the user data as root at boot; it has a provisioned server's SSH host private key, so no other user or container may.
		ip daddr 169.254.169.254 tcp dport 80 meta skuid 0 accept
	}
}
