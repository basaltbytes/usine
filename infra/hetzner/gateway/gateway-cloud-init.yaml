#cloud-config
# The usine gateway VM: SSH bastion, DNS resolver and time server for
# Workers, the gateway service (credential-injecting reverse proxy, forward
# proxy, admin API), Tailscale, and nftables. gateway.sh replaces the @@NAME@@
# placeholders before the VM is created. No secret is in this file: the VM
# generates its own admin token and caller key, API keys are copied in over
# SSH, and `gateway.sh tailnet-up` logs Tailscale in over SSH.

package_update: true
packages:
  - ca-certificates
  - chrony
  - curl
  - dnsmasq
  - nftables
  - openssl
  - xz-utils

write_files:
  - path: /etc/nftables.conf
    permissions: "0644"
    encoding: b64
    content: "@@GATEWAY_NFTABLES_B64@@"

  - path: /etc/usine-gateway/egress-allowlist
    permissions: "0644"
    encoding: b64
    content: "@@EGRESS_ALLOWLIST_B64@@"

  - path: /etc/usine-gateway/settings.env
    permissions: "0644"
    content: |
      USINE_GATEWAY_DOMAIN=@@DOMAIN@@
      USINE_GATEWAY_PROXY_HOST=0.0.0.0
      USINE_GATEWAY_PROXY_PORT=80
      USINE_GATEWAY_EGRESS_HOST=@@GATEWAY_IP@@
      USINE_GATEWAY_EGRESS_PORT=3128
      USINE_GATEWAY_ADMIN_HOST=127.0.0.1
      USINE_GATEWAY_ADMIN_PORT=7070
      USINE_GATEWAY_EGRESS_ALLOWLIST=/etc/usine-gateway/egress-allowlist

  # dnsmasq answers Worker queries for the gateway's names only. It has no upstream server, so it refuses every other name, and it logs each query to the journal.
  # With local=, an AAAA query for the gateway's names gets an empty answer instead of a refusal, because musl's resolver, which Codex uses, fails the whole lookup on a refusal.
  - path: /etc/dnsmasq.d/usine-gateway.conf
    permissions: "0644"
    content: |
      bind-dynamic
      listen-address=@@GATEWAY_IP@@
      no-resolv
      no-hosts
      log-queries
      address=/@@DOMAIN@@/@@GATEWAY_IP@@
      local=/@@DOMAIN@@/

  # chrony reads this file next to its own chrony.conf, which keeps the Debian pool as a time source.
  - path: /etc/chrony/conf.d/usine-gateway.conf
    permissions: "0644"
    content: |
      server ntp1.hetzner.de iburst
      server ntp2.hetzner.com iburst
      server ntp3.hetzner.net iburst
      allow @@NETWORK_CIDR@@

  # Written before the package is installed, so dnsmasq never becomes the gateway's own resolver through resolvconf.
  - path: /etc/default/dnsmasq
    permissions: "0644"
    content: |
      DNSMASQ_EXCEPT="lo"
      CONFIG_DIR=/etc/dnsmasq.d,.dpkg-dist,.dpkg-old,.dpkg-new

  - path: /etc/ssh/sshd_config.d/50-usine-gateway.conf
    permissions: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
      AllowTcpForwarding local
      AllowAgentForwarding no
      AllowStreamLocalForwarding no
      GatewayPorts no
      PermitTunnel no
      X11Forwarding no

