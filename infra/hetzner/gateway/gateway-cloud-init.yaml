  - path: /etc/sysctl.d/90-usine-gateway.conf
    permissions: "0644"
    content: |
      net.ipv4.ip_forward = 0
      net.ipv6.conf.all.forwarding = 0

  - path: /etc/systemd/system/usine-gateway.service
    permissions: "0644"
    content: |
      [Unit]
      Description=usine gateway
      Wants=network-online.target
      After=network-online.target

      [Service]
      User=usine-gateway
      Group=usine-gateway
      Environment=USINE_GATEWAY_ENVIRONMENT_FILES=/etc/usine-gateway/settings.env:/etc/usine-gateway/secrets.env
      ExecStart=/usr/local/bin/usine-gateway
      ExecReload=kill -HUP $MAINPID
      # The state directory stores encrypted attachments and the ChatGPT login's auth.json; ProtectSystem=strict permits writes here.
      StateDirectory=usine-gateway
      StateDirectoryMode=0700
      AmbientCapabilities=CAP_NET_BIND_SERVICE
      CapabilityBoundingSet=CAP_NET_BIND_SERVICE
      NoNewPrivileges=yes
      ProtectSystem=strict
      ProtectHome=yes
      PrivateTmp=yes
      Restart=always
      RestartSec=2

      [Install]
      WantedBy=multi-user.target

  - path: /usr/local/sbin/usine-gateway-install
    permissions: "0755"
    content: |
      #!/bin/sh
      # Installs or upgrades the gateway from npm package specs or tarballs made with pnpm pack, then restarts it.
      # One tree for all of them, so @usine/gateway and @usine/core share one copy of effect. Each install
      # builds a new tree, since npm doesn't replace the effect peer of the packages already installed.
      set -eu
      rm -rf /opt/usine-gateway.next
      npm install --prefix /opt/usine-gateway.next --omit=dev "$@"
      rm -rf /opt/usine-gateway.previous
      if [ -e /opt/usine-gateway ]; then mv /opt/usine-gateway /opt/usine-gateway.previous; fi
      mv /opt/usine-gateway.next /opt/usine-gateway
      ln -sf /opt/usine-gateway/node_modules/.bin/usine-gateway /usr/local/bin/usine-gateway
      systemctl restart usine-gateway

  # One script with set -e, so a failed step marks cloud-init as failed instead of being skipped over.
  - path: /usr/local/sbin/usine-gateway-setup
    permissions: "0755"
    content: |
      #!/bin/sh
      set -eu
      id usine-gateway > /dev/null 2>&1 || useradd --system --no-create-home --shell /usr/sbin/nologin usine-gateway
      umask 077
      if [ ! -f /etc/usine-gateway/secrets.env ]; then
        printf 'USINE_GATEWAY_ADMIN_TOKEN=%s\nUSINE_GATEWAY_CALLER_KEY=%s\n' \
          "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" > /etc/usine-gateway/secrets.env
      fi
      chgrp usine-gateway /etc/usine-gateway/secrets.env
      chmod 0640 /etc/usine-gateway/secrets.env
      umask 022
      sysctl --system > /dev/null
      systemctl enable --now nftables
      systemctl restart dnsmasq
      if [ -e /run/resolvconf/interface/lo.dnsmasq ]; then resolvconf -d lo.dnsmasq; fi
      systemctl reload ssh
      codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
      echo "deb [signed-by=/etc/apt/keyrings/tailscale.asc] https://pkgs.tailscale.com/stable/debian $codename main" > /etc/apt/sources.list.d/tailscale.list
      apt-get update
      DEBIAN_FRONTEND=noninteractive apt-get install -y tailscale
      version=v24.22.1
      case "$(uname -m)" in
        x86_64) arch=x64 sum=6c172a9ab6718f7b801fb5a7bd486af2ee5e32758086a04b84fcce2aa77095e6 ;;
        aarch64) arch=arm64 sum=dbabf7a1cbf947e6059ffad2c27b80041db97dea1e553b62afdee7f13fca336e ;;
        *) echo "unsupported architecture $(uname -m)" >&2; exit 1 ;;
      esac
      archive=$(mktemp)
      curl -fsSL -o "$archive" "https://nodejs.org/dist/$version/node-$version-linux-$arch.tar.xz"
      echo "$sum  $archive" | sha256sum -c -
      tar -xJf "$archive" -C /usr/local --strip-components=1 --exclude=CHANGELOG.md --exclude=README.md --exclude=LICENSE
      rm -f "$archive"
      systemctl daemon-reload
      systemctl enable usine-gateway

runcmd:
  - [/usr/local/sbin/usine-gateway-setup]
