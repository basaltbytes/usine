#cloud-config
# Puts a Worker VM without public addresses behind the gateway: the gateway
# as resolver, time server, and forward proxy, gh's HTTP socket forwarded to
# the gateway, Docker pulling through the forward proxy, and nftables that
# allow only the gateway.
# `gateway.sh worker-user-data` replaces the @@NAME@@ placeholders and sends
# this file after the Worker file of ../cloud-init.yaml, which creates the
# usine user and installs the toolchain and harnesses through the proxy set
# here.

bootcmd:
  # The private network's DHCP offers no resolver, and nothing else may answer.
  - [sh, -c, 'rm -f /etc/resolv.conf && printf "nameserver @@GATEWAY_IP@@\n" > /etc/resolv.conf']

apt:
  http_proxy: http://@@GATEWAY_IP@@:3128
  https_proxy: http://@@GATEWAY_IP@@:3128

package_update: true
packages:
  - nftables

write_files:
  - path: /etc/nftables.conf
    permissions: "0644"
    encoding: b64
    content: "@@WORKER_NFTABLES_B64@@"

  # Every SSH session reads this file, including the harness logins, and so does the setup script of ../cloud-init.yaml.
  - path: /etc/environment
    append: true
    content: |
      GH_HOST=git.@@DOMAIN@@
      HTTPS_PROXY=http://@@GATEWAY_IP@@:3128
      HTTP_PROXY=http://@@GATEWAY_IP@@:3128
      https_proxy=http://@@GATEWAY_IP@@:3128
      http_proxy=http://@@GATEWAY_IP@@:3128
      NO_PROXY=@@DOMAIN@@
      no_proxy=@@DOMAIN@@
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1

  # Docker pulls the attempt image through the forward proxy, whose allowlist has ghcr.io.
  - path: /etc/systemd/system/docker.service.d/http-proxy.conf
    permissions: "0644"
    content: |
      [Service]
      Environment=HTTPS_PROXY=http://@@GATEWAY_IP@@:3128
      Environment=HTTP_PROXY=http://@@GATEWAY_IP@@:3128
      Environment=NO_PROXY=@@DOMAIN@@

  # Attempt containers use the host network, so the nftables rules above stay the only rules; Docker adds none.
  - path: /etc/docker/daemon.json
    permissions: "0644"
    content: |
      {"iptables": false, "ip6tables": false}

  # The empty NTP= drops the image's time servers, which the Worker cannot reach.
  - path: /etc/systemd/timesyncd.conf.d/usine-gateway.conf
    permissions: "0644"
    content: |
      [Time]
      NTP=
      NTP=@@GATEWAY_IP@@

  # gh speaks HTTPS to GH_HOST; through this socket it speaks plain HTTP to the gateway instead, so no certificate is needed.
  - path: /etc/systemd/system/usine-gateway-http.socket
    permissions: "0644"
    content: |
      [Unit]
      Description=Socket for gh to reach the usine gateway

      [Socket]
      ListenStream=/run/usine-gateway/http.sock
      SocketMode=0666
      DirectoryMode=0755

      [Install]
      WantedBy=sockets.target

  - path: /etc/systemd/system/usine-gateway-http.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Forwards gh's socket to the usine gateway
      Requires=usine-gateway-http.socket
      After=usine-gateway-http.socket

      [Service]
      ExecStart=/usr/lib/systemd/systemd-socket-proxyd @@GATEWAY_IP@@:80
      DynamicUser=yes
      PrivateTmp=yes

  # The executor sends each Attempt's caller token in these variables over the SSH connection, so the token never appears on a command line.
  - path: /etc/ssh/sshd_config.d/40-usine-gateway.conf
    permissions: "0644"
    content: |
      AcceptEnv GIT_CONFIG_VALUE_0 GH_ENTERPRISE_TOKEN GH_TOKEN ANTHROPIC_AUTH_TOKEN

  - path: /etc/skel/.config/gh/config.yml
    permissions: "0644"
    content: |
      http_unix_socket: /run/usine-gateway/http.sock

  - path: /root/.config/gh/config.yml
    permissions: "0644"
    content: |
      http_unix_socket: /run/usine-gateway/http.sock

runcmd:
  - [systemctl, daemon-reload]
  - [systemctl, enable, --now, usine-gateway-http.socket]
  - [systemctl, enable, --now, nftables]
  - [systemctl, restart, systemd-timesyncd]
  - [systemctl, reload, ssh]
