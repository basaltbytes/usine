#!/usr/sbin/nft -f
# The gateway VM: SSH from the tailnet and from anywhere the Hetzner firewall
# allows, port 80 from the tailnet, other services from the private network, no
# connections from the gateway into the tailnet, and no forwarding, so a
# Worker reaches nothing the gateway does not proxy.

define network = 10.42.0.0/16

flush ruleset

table inet usine_gateway {
	chain input {
		type filter hook input priority filter; policy drop;
		iif lo accept
		ct state established,related accept
		ct state invalid drop
		meta l4proto { icmp, ipv6-icmp } accept
		tcp dport 22 accept
		iifname "tailscale0" tcp dport 80 accept
		# DHCP renewals for the private network address.
		udp sport 67 udp dport 68 accept
		ip saddr $network udp dport { 53, 123 } accept
		ip saddr $network tcp dport { 53, 80, 3128 } accept
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy accept;
		# The bastion only opens SSH connections into the private network.
		tcp dport 22 ip daddr != $network reject
		# The gateway only answers connections from the tailnet; replies are established, not new.
		oifname "tailscale0" ct state new reject
	}
}
