// Wire-compatible projection of boxd.api.v1 from @boxd-sh/sdk 0.3.0 (MIT).
// Only the provisioner's RPCs and fields are retained; unknown fields are ignored.
syntax = "proto3";
package boxd.api.v1;

message WhoamiRequest {}
message WhoamiResponse { string user_id = 1; repeated string pubkey_fingerprints = 2; }
message GetOrgMachineLimitRequest { string org_id = 1; }
message GetOrgMachineLimitResponse { uint32 max_vms = 3; uint32 vm_count = 4; }
message GetSnapshotRequest { string name = 1; string org = 2; }
message SnapshotInfo {
  string name = 2;
  string status = 4;
  uint32 vcpu = 9;
  uint64 memory_bytes = 10;
  string region = 17;
}
message GetSnapshotResponse { SnapshotInfo snapshot = 1; }
message ListRegionsRequest { string org_id = 1; }
message Region { string id = 1; string api_endpoint = 4; bool home = 8; }
message ListRegionsResponse { repeated Region regions = 1; string this_region = 3; }
message NetworkConfig { optional bool ssh = 1; }
message VmConfig { NetworkConfig network = 5; }
message CreateVmFromSnapshotRequest {
  string snapshot = 1;
  string name = 2;
  VmConfig config = 3;
  string org = 4;
  bool isolated = 5;
  map<string, string> labels = 6;
}
message CreateVmResponse { string vm_id = 1; GetVmResponse machine = 9; }
message GetVmRequest { string vm_id = 1; }
message GetVmResponse {
  string vm_id = 1;
  string public_ip = 4;
  string status = 5;
  uint32 ssh_port = 9;
  int64 created_at = 17;
  map<string, string> labels = 34;
  bool ssh_disabled = 41;
  repeated string egress_allow = 28;
}
message ListVmsRequest { string org = 1; repeated string label_selector = 3; }
message ListVmsResponse { repeated GetVmResponse vms = 1; string ssh_host_key = 2; }
message UpdateVmLabelsRequest { string vm = 1; map<string, string> set = 2; }
message UpdateVmLabelsResponse {}
message DestroyVmRequest { string vm_id = 1; }
message DestroyVmResponse {}
message SetAutoHibernateTimeoutRequest { string vm_id = 1; uint32 timeout_secs = 2; }
message SetAutoHibernateTimeoutResponse {}
message SetAutoSuspendTimeoutRequest { string vm_id = 1; uint32 timeout_secs = 2; }
message SetAutoSuspendTimeoutResponse {}
message SetVmEgressAllowRequest { string vm = 1; repeated string entries = 2; }
message SetVmEgressAllowResponse { repeated string entries = 1; }
// The first client chunk carries vm_id and command; later client chunks carry stdin bytes with
// stdin set. The server sends output chunks, stderr marked by is_stderr, then one chunk with empty
// data and exit_code.
message ExecChunk {
  bytes data = 1;
  bool stdin = 2;
  string command = 4;
  string vm_id = 5;
  int32 exit_code = 6;
  bool is_stderr = 10;
}

service BoxdApi {
  rpc Whoami(WhoamiRequest) returns (WhoamiResponse);
  rpc GetOrgMachineLimit(GetOrgMachineLimitRequest) returns (GetOrgMachineLimitResponse);
  rpc GetSnapshot(GetSnapshotRequest) returns (GetSnapshotResponse);
  rpc ListRegions(ListRegionsRequest) returns (ListRegionsResponse);
  rpc CreateVmFromSnapshot(CreateVmFromSnapshotRequest) returns (CreateVmResponse);
  rpc GetVm(GetVmRequest) returns (GetVmResponse);
  rpc ListVms(ListVmsRequest) returns (ListVmsResponse);
  rpc UpdateVmLabels(UpdateVmLabelsRequest) returns (UpdateVmLabelsResponse);
  rpc DestroyVm(DestroyVmRequest) returns (DestroyVmResponse);
  rpc SetAutoHibernateTimeout(SetAutoHibernateTimeoutRequest) returns (SetAutoHibernateTimeoutResponse);
  rpc SetAutoSuspendTimeout(SetAutoSuspendTimeoutRequest) returns (SetAutoSuspendTimeoutResponse);
  rpc SetVmEgressAllow(SetVmEgressAllowRequest) returns (SetVmEgressAllowResponse);
  rpc Exec(stream ExecChunk) returns (stream ExecChunk);
}
