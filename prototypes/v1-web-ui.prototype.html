<!--
  PROTOTYPE — throwaway. Do not productionize.
  Four variants of the usine v1 web UI (observe + intervene), switchable via
  ?variant=D|A|B|C or the ←/→ keys / bottom bar. D (default): projects home +
  per-repo kanban, lanes synced to GitHub labels, drag = label swap that can
  fire a loop (stubbed). One shared fake dataset dry-runs the acceptance loops
  (dev-on-ready, review-prs, apply-review-findings) through the settled run
  model. Wayfinder ticket: basaltbytes/usine#12.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>usine v1 UI — prototype</title>
<style>
  :root{
    --bg:#0e1116; --panel:#151b23; --panel2:#1b222c; --border:#242e3a;
    --fg:#dce3ec; --dim:#8b98a9; --dimmer:#5f6b7c;
    --running:#4da3ff; --waiting:#e8b93e; --failed:#ef6b6b; --ok:#3ecf8e;
    --canceled:#7b8494; --pending:#9aa7b8; --accent:#7c5cff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,sans-serif}
  a{color:var(--running);text-decoration:none}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
  .dim{color:var(--dim)} .dimmer{color:var(--dimmer)} .small{font-size:12px}

  .badge{display:inline-flex;align-items:center;gap:6px;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid transparent;white-space:nowrap}
  .badge::before{content:"";width:7px;height:7px;border-radius:99px;background:currentColor}
  .b-running{color:var(--running);border-color:#274b73;background:#14263c}
  .b-waiting{color:var(--waiting);border-color:#6d5a1e;background:#302811}
  .b-failed{color:var(--failed);border-color:#6d2e2e;background:#331717}
  .b-succeeded{color:var(--ok);border-color:#1f5c42;background:#0f2a1f}
  .b-canceled{color:var(--canceled);border-color:#3a4350;background:#1a2029}
  .b-pending{color:var(--pending);border-color:#3a4350;background:#1a2029}

  .chip{display:inline-flex;align-items:center;gap:6px;padding:1px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--border);font-size:12px;white-space:nowrap}
  .chip .dot{width:8px;height:8px;border-radius:3px}

  .btn{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:7px;border:1px solid var(--border);background:var(--panel2);color:var(--fg);font:600 13px system-ui;cursor:pointer}
  .btn:hover{border-color:#3a4757}
  .btn-approve{background:#123626;border-color:#1f5c42;color:var(--ok)}
  .btn-danger{background:#331717;border-color:#6d2e2e;color:var(--failed)}
  .btn-retry{background:#14263c;border-color:#274b73;color:var(--running)}
  .btn:disabled{opacity:.4;cursor:default}

  .panel{background:var(--panel);border:1px solid var(--border);border-radius:10px}
  h1,h2,h3{margin:0;font-weight:650}

  /* ---------- Variant A: runs console ---------- */
  .a-wrap{display:grid;grid-template-columns:230px minmax(0,1fr);height:100vh}
  .a-side{border-right:1px solid var(--border);background:var(--panel);padding:14px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
  .a-side .f{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-radius:7px;cursor:pointer;color:var(--dim);font-weight:550}
  .a-side .f:hover{background:var(--panel2)}
  .a-side .f.on{background:var(--panel2);color:var(--fg)}
  .a-side .cnt{font-size:11.5px;color:var(--dimmer)}
  .a-main{overflow-y:auto}
  .a-top{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:5}
  table.runs{width:100%;border-collapse:collapse}
  table.runs td{padding:9px 12px;border-bottom:1px solid #1b222c;vertical-align:middle;white-space:nowrap}
  table.runs td.grow{white-space:normal}
  table.runs tr.row{cursor:pointer}
  table.runs tr.row:hover{background:#131922}
  table.runs tr.row.sel{background:#17202c}
  .attn{color:var(--waiting);font-weight:700}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(56vw,780px);background:var(--panel);border-left:1px solid var(--border);box-shadow:-18px 0 40px #0009;z-index:20;display:flex;flex-direction:column}
  .drawer .dhead{padding:14px 18px;border-bottom:1px solid var(--border)}
  .drawer .dbody{overflow-y:auto;padding:16px 18px;flex:1}
  .tabs{display:flex;gap:2px;margin-top:12px}
  .tabs .t{padding:6px 13px;border-radius:7px 7px 0 0;cursor:pointer;color:var(--dim);font-weight:600;font-size:13px}
  .tabs .t.on{background:var(--bg);color:var(--fg);border:1px solid var(--border);border-bottom-color:var(--bg)}

  /* ---------- Variant B: factory floor ---------- */
  .b-wrap{max-width:1180px;margin:0 auto;padding:20px 22px 90px}
  .b-attn{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 20px}
  .b-attn .card{flex:1;min-width:240px;padding:10px 14px;display:flex;flex-direction:column;gap:6px}
  .loopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
  .loopcard{padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:8px}
  .loopcard:hover{border-color:#3a4757}
  .counts{display:flex;gap:8px;flex-wrap:wrap}
  .b-loop{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
  .src{padding:14px 16px;white-space:pre-wrap;overflow-x:auto}
  .b-runrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid #1b222c;cursor:pointer}
  .b-runrow:hover{background:#131922}

  /* ---------- Variant C: inbox ---------- */
  .c-wrap{max-width:780px;margin:0 auto;padding:22px 18px 110px}
  .c-card{padding:16px 18px;margin-bottom:14px;display:flex;flex-direction:column;gap:10px}
  .c-kind{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}
  .c-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .c-actions .btn{padding:8px 16px;font-size:14px}
  .feeditem{display:flex;gap:10px;padding:7px 4px;border-bottom:1px solid #1b222c;color:var(--dim);font-size:13px}
  .feeditem .when{color:var(--dimmer);min-width:64px}

  /* ---------- shared: transcript, misc ---------- */
  .tr-item{border-left:3px solid var(--border);padding:6px 12px;margin:8px 0}
  .tr-parent{border-left-color:var(--accent)}
  .tr-tool{border-left-color:#3a4757;color:var(--dim)}
  .tr-steer{border-left-color:var(--waiting);background:#2a230f;border-radius:0 7px 7px 0}
  .tr-result{border-left-color:var(--ok);background:#0f2a1f;border-radius:0 7px 7px 0}
  details.child{border:1px solid var(--border);border-radius:8px;margin:8px 0;background:var(--panel2)}
  details.child>summary{padding:8px 12px;cursor:pointer;display:flex;gap:10px;align-items:center;list-style:none}
  details.child>summary::before{content:"▸";color:var(--dimmer)}
  details.child[open]>summary::before{content:"▾"}
  details.child .inner{padding:2px 12px 10px;border-top:1px solid var(--border)}
  .who{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--dimmer)}
  .kv{display:grid;grid-template-columns:130px 1fr;gap:4px 14px;font-size:13px}
  .kv .k{color:var(--dimmer)}
  .box{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin:10px 0}
  .attempts td{padding:6px 10px;border-bottom:1px solid #1b222c;font-size:13px;vertical-align:top}
  .err{color:var(--failed)}
  .diff{background:#10151c;border:1px solid var(--border);border-radius:8px;padding:10px 14px;overflow-x:auto;margin:8px 0}
  .diff .add{color:var(--ok)} .diff .del{color:var(--failed)}
  .steerbox{display:flex;gap:8px;margin-top:6px}
  .steerbox input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:7px 11px;color:var(--fg);font:13px system-ui}

  /* ---------- Variant D: projects + kanban ---------- */
  .d-nav{display:flex;align-items:center;gap:18px;padding:12px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:5}
  .d-nav .navlink{color:var(--dim);font-weight:600;cursor:pointer}
  .d-nav .navlink:hover{color:var(--fg)}
  .d-nav .navlink.on{color:var(--fg)}
  .d-wrap{max-width:1320px;margin:0 auto;padding:20px 22px 100px}
  .projgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .projcard{padding:16px 18px;cursor:pointer;display:flex;flex-direction:column;gap:8px}
  .projcard:hover{border-color:#3a4757}
  .board{display:flex;gap:12px;align-items:flex-start;overflow-x:auto;padding-bottom:20px}
  .col{min-width:236px;flex:1;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px;min-height:180px}
  .col-head{display:flex;flex-direction:column;gap:2px;padding:2px 4px 10px}
  .lanecap{font-size:10.5px;color:var(--dimmer)}
  .kcard{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;margin-bottom:8px;cursor:grab;display:flex;flex-direction:column;gap:5px}
  .kcard:hover{border-color:#3a4757}
  .klabel{display:inline-block;padding:0 7px;border-radius:99px;font-size:10.5px;background:#22303f;color:#9fb3c8}

  /* ---------- switcher + toast ---------- */
  #switcher{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:99;display:flex;align-items:center;gap:2px;background:#000c;border:1px solid #4a5568;border-radius:99px;padding:5px 8px;backdrop-filter:blur(8px);box-shadow:0 6px 24px #000a}
  #switcher .arrow{cursor:pointer;padding:2px 10px;font-size:15px;color:#cbd5e1;border-radius:99px}
  #switcher .arrow:hover{background:#ffffff22}
  #switcher .lbl{padding:0 10px;font:600 13px system-ui;color:#fff;min-width:210px;text-align:center}
  #switcher .note{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:10px;color:#64748b;letter-spacing:.05em}
  #toast{position:fixed;bottom:66px;left:50%;transform:translateX(-50%);z-index:98;background:#1c2733;border:1px solid #3a4757;color:var(--fg);padding:9px 16px;border-radius:9px;font-size:13px;box-shadow:0 6px 24px #000a;opacity:0;transition:opacity .2s;pointer-events:none;max-width:640px;text-align:center}
</style>
</head>

/* =============================== state =============================== */
const VARIANTS = [
  {key:"D", name:"Projects home — kanban per repo"},
  {key:"A", name:"Runs console — one queue, drawer detail"},
  {key:"B", name:"Factory floor — loops as the spine"},
  {key:"C", name:"Operator inbox — needs-you first"},
];
const S = { variant:"D", sel:null, loopSel:null, tab:"overview", filter:"all", feedOpen:false, page:"home", repoSel:null };

/* =============================== helpers =============================== */
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const run = id => RUNS.find(r => r.id === id);
const loop = f => LOOPS.find(l => l.file === f);
const itemRef = r => r.item.kind === "tick" ? "tick" : `${r.repo.split("/")[1]}#${r.item.num}`;
const badge = st => `<span class="badge b-${st}">${st}</span>`;
const agentChip = name => { const a = AGENTS[name];
  return `<span class="chip"><span class="dot" style="background:${a.color}"></span>${esc(name)} <span class="dimmer">· ${a.harness}</span></span>`; };
const needsMe = r => r.state === "waiting" || (r.state === "failed" && r.needs === "retry");

function toast(msg){ const t = $("#toast"); t.textContent = msg; t.style.opacity = 1;
  clearTimeout(t._h); t._h = setTimeout(() => t.style.opacity = 0, 3800); }

/* ---- interventions (in-memory stubs) ---- */
function doApprove(id){ const r = run(id);
  r.state = "running"; r.needs = null; r.updated = "now";
  r.attempts.push({n:1, state:"running", worker:"local", started:"now", error:null});
  r.transcript.push({t:"parent", text:"Approval consumed — starting on the review findings."});
  toast("Approval recorded as an Event — the waiting run consumed it and attempt 1 started (stub)."); render(); }
function doRetry(id){ const r = run(id);
  const n = r.attempts.length + 1;
  r.state = "running"; r.needs = null; r.updated = "now";
  r.attempts.push({n, state:"running", worker:"local", started:"now", error:null});
  toast(`Operator retry → attempt ${n} under the same step (stub).`); render(); }
function doCancel(id){ const r = run(id);
  r.state = "canceled"; r.needs = null; r.updated = "now";
  r.reason = "Canceled by operator.";
  r.attempts.forEach(a => { if(a.state === "running") a.state = "canceled"; });
  toast("Run canceled by operator (stub)."); render(); }
function doSteer(id){ const inp = document.getElementById("steer-" + id);
  if(!inp || !inp.value.trim()) { toast("Type a steer message first."); return; }
  const r = run(id); r.transcript.push({t:"steer", text:inp.value.trim()}); r.updated = "now";
  toast("Steer delivered to the Pi parent session over the attempt channel (stub)."); render(); }
function doInterrupt(id){ const r = run(id);
  r.transcript.push({t:"steer", text:"⏸ Interrupt — parent paused at the next tool boundary, waiting for a steer."});
  toast("Interrupt sent — parent pauses and waits for a steer (stub)."); render(); }

/* ---- shared fragments ---- */
function actionsHTML(r, ctx){
  const A = [];
  if(r.state === "waiting")  A.push(`<button class="btn btn-approve" data-action="approve" data-id="${r.id}">✓ Approve</button>`);
  if(r.state === "failed" && r.needs === "retry") A.push(`<button class="btn btn-retry" data-action="retry" data-id="${r.id}">↻ Retry</button>`);
  if(r.state === "running"){ A.push(`<button class="btn" data-action="interrupt" data-id="${r.id}">⏸ Interrupt</button>`); }
  if(["running","waiting","pending","failed"].includes(r.state))
    A.push(`<button class="btn btn-danger" data-action="cancel" data-id="${r.id}">✕ Cancel</button>`);
  let steer = "";
  if(r.state === "running")
    steer = `<div class="steerbox"><input id="steer-${r.id}" placeholder="Steer the parent session… (e.g. 'skip the e2e suite, it is flaky')">
             <button class="btn" data-action="steer" data-id="${r.id}">Steer ➤</button></div>`;
  return `<div class="c-actions">${A.join("")}</div>${steer}`;
}

function transcriptHTML(r){
  if(!r.transcript.length) return `<div class="dim small">No transcript yet — no attempt has started.</div>`;
  return r.transcript.map(e => {
    if(e.t === "parent") return `<div class="tr-item tr-parent"><div class="who">pi parent</div>${esc(e.text)}</div>`;
    if(e.t === "tool")   return `<div class="tr-item tr-tool mono">⚙ ${esc(e.line)}</div>`;
    if(e.t === "steer")  return `<div class="tr-item tr-steer"><div class="who">operator steer</div>${esc(e.text)}</div>`;
    if(e.t === "result") return `<div class="tr-item tr-result"><div class="who">step result</div>${esc(e.text)}</div>`;
    if(e.t === "child")  return `<details class="child" ${e.state==="running"?"open":""}><summary>
        <span class="who">child · ${esc(e.harness)}</span> <span>${esc(e.label)}</span>
        <span class="dimmer small mono" style="margin-left:auto">${esc(e.usage)} · ${esc(e.state)}</span></summary>
      <div class="inner">${e.events.map(c => `<div class="tr-item tr-tool mono">${c.t==="tool"?"⚙":"⚠"} ${esc(c.line)}</div>`).join("")}</div>
      </details>`;
    return "";
  }).join("");
}

function attemptsHTML(r){
  if(!r.attempts.length) return `<div class="dim small">No attempts yet.</div>`;
  return `<table class="attempts" style="width:100%;border-collapse:collapse">${r.attempts.map(a => `
    <tr><td class="mono">#${a.n}</td><td>${badge(a.state)}</td>
        <td class="mono dim">${esc(a.worker)}</td><td class="dim small">${esc(a.started)}</td>
        <td class="small ${a.error?"err":""}" style="white-space:normal">${esc(a.error||"")}</td></tr>`).join("")}</table>`;
}

  const l = loop(r.loop);

    <div class="box"><div class="who" style="margin-bottom:6px">event</div>
      <div class="kv">

        <div class="k">payload gist</div><div class="mono dim">${esc(r.event.gist)}</div>

function changesHTML(r){

function lastLine(r){
  for(let i = r.transcript.length - 1; i >= 0; i--){ const e = r.transcript[i];
    if(e.t === "child" && e.events.length) return e.events[e.events.length-1].line;
    if(e.t === "tool") return e.line; if(e.t === "parent") return e.text.slice(0, 90); }
  return "…"; }

            <span class="lanecap mono">${esc(l.map)}</span></div>
          ${cards.map(kcardHTML).join("") || `<div class="dimmer small" style="padding:6px 4px">—</div>`}
        </div>`; }).join("")}
    </div>`;
}
function projHome(){
  const attn = RUNS.filter(needsMe);
  return `
    ${attn.length ? `<div class="b-attn">${attn.map(r => `<div class="panel card">
        <div class="c-kind" style="color:${r.state === "waiting" ? "var(--waiting)" : "var(--failed)"}">${r.state === "waiting" ? "approval waiting" : "failed — your call"}</div>
        <div><b>${esc(r.loop.replace(".md",""))}</b> · <span class="mono">${esc(itemRef(r))}</span> <span class="dim">${esc(r.item.title)}</span></div>
        <div>${actionsHTML(r)}</div></div>`).join("")}</div>` : ""}
    <div class="projgrid">
      ${REPOS.map(p => { const pr = RUNS.filter(r => r.repo === p.name);
        const c = st => pr.filter(r => r.state === st).length;
        const need = pr.filter(needsMe).length;
        const working = [...new Set(pr.filter(r => r.state === "running").map(r => r.agent))];
        return `<div class="panel projcard" data-action="open-project" data-id="${esc(p.name)}">
          <div style="display:flex;align-items:center;gap:8px"><h3>${esc(p.name.split("/")[1])}</h3>
            ${p.tags.map(t => `<span class="chip small">${esc(t)}</span>`).join("")}
            ${need ? `<span style="margin-left:auto" class="badge b-waiting">${need} need you</span>` : ""}</div>
          <div class="dim small mono">${esc(p.name)}</div>
          <div class="counts">
            ${c("running") ? `<span class="badge b-running">${c("running")} running</span>` : ""}
            ${c("pending") ? `<span class="badge b-pending">${c("pending")} pending</span>` : ""}
            ${c("waiting") ? `<span class="badge b-waiting">${c("waiting")} waiting</span>` : ""}
            ${c("failed") ? `<span class="badge b-failed">${c("failed")} failed</span>` : ""}
            ${c("succeeded") ? `<span class="badge b-succeeded">${c("succeeded")} ok</span>` : ""}
          </div>
          <div class="dim small">${working.length ? "working now: " + working.map(esc).join(", ") : "quiet"}</div>
        </div>`; }).join("")}
    </div>`;
}
function projConfig(){
  return `<h2 style="margin-bottom:14px">Configuration <span class="dim small" style="font-weight:400">— loops, agents, workers, lanes. Edits round-trip through files in phildl/usine-instance.</span></h2>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px">
    <div class="panel" style="padding:14px 16px"><div class="who" style="margin-bottom:6px">loops</div>
      ${LOOPS.map(l => `<div style="padding:7px 0;border-bottom:1px solid #1b222c"><span class="mono">${esc(l.file)}</span>
        <div class="dim small mono">on: ${esc(l.on)} · agent: ${esc(l.agent)}${l.approval ? " · approval required" : ""}</div></div>`).join("")}</div>
    <div class="panel" style="padding:14px 16px"><div class="who" style="margin-bottom:6px">agents</div>
      ${Object.entries(AGENTS).map(([n,a]) => `<div style="padding:7px 0;border-bottom:1px solid #1b222c">
        ${agentChip(n)}<div class="dim small mono">${esc(a.model)} · effort ${esc(a.effort)}</div></div>`).join("")}</div>
    <div class="panel" style="padding:14px 16px"><div class="who" style="margin-bottom:6px">workers</div>
      ${WORKERS.map(w => `<div style="padding:5px 0" class="small">${w.status === "down" ? `<span class="err">${w.name} — ${esc(w.error)}</span>` : `${w.name} · ${w.busy}/${w.cap} busy`}</div>`).join("")}
      <div class="who" style="margin:12px 0 6px">lane map (per repo)</div>
      <div class="mono small dim">${LANES.map(l => `${l.name} ← ${esc(l.map)}`).join("<br>")}</div>
      <div class="dimmer small" style="margin-top:8px">Defaults proposed from the repo's GitHub labels. Two-way sync — usine never deletes a label.</div></div>
  </div>`;
}
function renderD(){
  const needCount = RUNS.filter(needsMe).length;
  const page = S.page || "home";
  const body = page === "config" ? projConfig() : S.repoSel ? projBoard(S.repoSel) : projHome();
  const r = S.sel ? run(S.sel) : null;
  return `
  <div class="d-nav"><h2>usine</h2>
    <span class="navlink ${page === "home" && !S.repoSel ? "on" : ""}" data-action="back-d">Projects</span>
    <span class="navlink ${page === "config" ? "on" : ""}" data-action="config-d">Configuration</span>
    <span style="margin-left:auto">${needCount ? `<span class="badge b-waiting" style="cursor:pointer" data-action="back-d">${needCount} need you</span>` : `<span class="dim small">all quiet</span>`}</span>
  </div>
  <div class="d-wrap">${body}</div>
  ${r ? drawerHTML(r) : ""}`;
}

/* ---- kanban drag = label swap (stub) ---- */
const LANE_LABEL = {ready:"ready", inprogress:"in-progress", inreview:"in-review"};
document.addEventListener("dragstart", e => {
  const c = e.target.closest?.("[data-item]"); if(!c) return;
  e.dataTransfer.setData("text/plain", c.dataset.item);
  e.dataTransfer.effectAllowed = "move";
});
document.addEventListener("dragover", e => { if(e.target.closest?.("[data-lane]")) e.preventDefault(); });
document.addEventListener("drop", e => {
  const col = e.target.closest?.("[data-lane]"); if(!col) return;
  e.preventDefault();
  const it = ITEMS.find(x => x.id === e.dataTransfer.getData("text/plain")); if(!it) return;
  const to = col.dataset.lane; if(to === it.lane) return;
  const toName = LANES.find(l => l.key === to).name;
  it.labels = it.labels.filter(l => !Object.values(LANE_LABEL).includes(l));
  if(LANE_LABEL[to]) it.labels.push(LANE_LABEL[to]);
  it.lane = to;
  if(to === "ready" && it.kind === "issue" && !it.runId){
    const rid = "r" + (RUNS.length + 1);
    RUNS.unshift({id:rid, loop:"dev-on-ready.md", repo:it.repo, state:"pending",
      item:{kind:it.kind, num:it.num, title:it.title}, agent:"codex-max", updated:"now", opened:"now",
      note:"Queued — your drag swapped the label to 'ready'; the trigger matched and opened this run.",
      event:{key:`issue/${it.repo.split("/")[1]}#${it.num} @ drag01`, gist:"labels: [ready] — swapped via board drag", at:"now"},
      attempts:[], transcript:[], changes:[]});
    it.runId = rid;
    FEED.unshift({when:"now", text:`Event detected → run opened: dev-on-ready · ${it.repo.split("/")[1]}#${it.num} (label swapped via board drag)`});
    toast("Label swap written to GitHub → 'ready' (two-way sync, nothing deleted). dev-on-ready matched — Event detected, run opened (stub).");
  } else {
    toast(`Card moved to ${toName}: label swap written to GitHub (stub) — no loop matched.`);
  }
  render();
});

/* =============================== shell =============================== */
function render(){
  const v = S.variant;
  $("#app").innerHTML = v === "D" ? renderD() : v === "A" ? renderA() : v === "B" ? renderB() : renderC();
  const def = VARIANTS.find(x => x.key === v);
  $("#swlbl").textContent = `${def.key} — ${def.name.split(" — ")[1] ? def.name.split(" — ")[0] + ": " + def.name.split(" — ")[1] : def.name}`;
}
function setVariant(key){
  S.variant = key; S.sel = null; S.loopSel = null; S.tab = "overview"; S.page = "home"; S.repoSel = null;
  const u = new URL(location.href); u.searchParams.set("variant", key);
  history.replaceState(null, "", u); render();
}
function cycle(d){
  const i = VARIANTS.findIndex(v => v.key === S.variant);
  setVariant(VARIANTS[(i + d + VARIANTS.length) % VARIANTS.length].key);
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if(!el) return;
  const act = el.dataset.action, id = el.dataset.id;
  if(act === "prev") return cycle(-1);
  if(act === "next") return cycle(1);
  if(act === "sel"){ S.sel = id; S.tab = "overview"; return render(); }
  if(act === "close"){ S.sel = null; return render(); }
  if(act === "tab"){ S.tab = id; return render(); }
  if(act === "filter"){ S.filter = id; S.sel = null; return render(); }
  if(act === "sel-loop"){ S.loopSel = id; S.sel = null; return render(); }
  if(act === "back"){ S.loopSel = null; S.sel = null; return render(); }
  if(act === "open-project"){ S.repoSel = id; S.page = "home"; S.sel = null; return render(); }
  if(act === "back-d"){ S.page = "home"; S.repoSel = null; S.sel = null; return render(); }
  if(act === "config-d"){ S.page = "config"; S.repoSel = null; S.sel = null; return render(); }
  if(act === "approve") return doApprove(id);
  if(act === "retry") return doRetry(id);
  if(act === "cancel") return doCancel(id);
  if(act === "steer") return doSteer(id);
  if(act === "interrupt") return doInterrupt(id);
  if(act === "feed"){ S.feedOpen = !S.feedOpen; }
});
document.addEventListener("keydown", e => {
  if(["INPUT","TEXTAREA"].includes(document.activeElement.tagName)) return;
  if(e.key === "ArrowLeft") cycle(-1);
  if(e.key === "ArrowRight") cycle(1);
});

const qv = new URL(location.href).searchParams.get("variant");
if(qv && VARIANTS.some(v => v.key === qv)) S.variant = qv;
render();
</script>
