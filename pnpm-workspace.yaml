# The `effect` pin lives here, once, per ADR 0012 — every block references it
# via `catalog:`; `pnpm publish` rewrites those references at pack time.
packages:
  - apps/*
  - packages/*
  - tooling/*

# Optional/package-maintenance scripts are unnecessary at runtime.
allowBuilds:
  "@google/genai": false
  esbuild: false
  msgpackr-extract: false
  protobufjs: false

patchedDependencies:
  drizzle-orm@1.0.0-rc.4: patches/drizzle-orm@1.0.0-rc.4.patch

catalog:
  "@changesets/cli": 3.0.1
  "@effect/language-service": 0.87.2
  "@effect/platform-node": 4.0.0-rc.111
  "@effect/sql-sqlite-node": 4.0.0-rc.111
  "@oxlint/plugins": 1.79.0
  "@effect/vitest": 4.0.0-rc.111
  drizzle-kit: 1.0.0-rc.4
  drizzle-orm: 1.0.0-rc.4
  effect: 4.0.0-rc.111
  knip: 6.32.2
  oxfmt: 0.64.0
  oxlint: 1.79.0
  turbo: 2.10.11
  typescript: 7.0.2
  vitest: 4.1.11

minimumReleaseAgeExclude:
  - "@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.261"
  - "@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.261"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.261"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.261"
  - "@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.261"
  - "@anthropic-ai/claude-agent-sdk-linux-x64@0.3.261"
  - "@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.261"
  - "@anthropic-ai/claude-agent-sdk-win32-x64@0.3.261"
  - "@anthropic-ai/claude-agent-sdk@0.3.261"
  - "@earendil-works/chord@1.1.0"
  - "@earendil-works/pi-agent-core@1.1.0"
  - "@earendil-works/pi-ai@1.1.0"
  - "@earendil-works/pi-coding-agent@1.1.0"
  - "@earendil-works/pi-telemetry@1.1.0"
  - "@earendil-works/pi-tui@1.1.0"
  - "@earendil-works/pi-codemode@1.1.0"
  - "@earendil-works/pi-mcp@1.1.0"
  - "@earendil-works/pi-durable@1.1.0"
