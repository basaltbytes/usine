# The `effect` pin lives here, once, per ADR 0012 — every block references it
# via `catalog:`; `pnpm publish` rewrites those references at pack time.
packages:
  - apps/*
  - packages/*
  - tooling/*

# Optional/package-maintenance scripts are unnecessary at runtime.
allowBuilds:
  "@google/genai": false
  esbuild: false
  msgpackr-extract: false
  protobufjs: false
  workerd: false

catalog:
  "@changesets/cli": 3.0.3
  "@effect/platform-node": 4.1.2
  "@effect/platform-node-shared": 4.1.2
  "@effect/sql-sqlite-node": 4.1.2
  "@effect/tsgo": 0.67.0
  "@effect/vitest": 4.1.2
  "@oxlint/plugins": 1.91.0
  "@vitest/browser-playwright": 5.1.0
  drizzle-kit: 1.0.0-rc.5
  drizzle-orm: 1.0.0-rc.5
  effect: 4.1.2
  knip: 6.44.1
  oxfmt: 0.76.0
  oxlint: 1.91.0
  oxlint-tsgolint: 7.0.2005
  turbo: 2.11.10
  typescript: 7.0.2
  vitest: 5.1.0

# undici below 7.30.1 and 8.12.2 accepts certificates it should reject (CVE-2026-109383) and crashes on TLS renegotiation (CVE-2026-87018). The overrides stay in each dependency's major.
overrides:
  "undici@7": ^7.30.1
  "undici@8": ^8.12.2

minimumReleaseAgeExclude:
  - "@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.308"
  - "@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.308"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.308"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.308"
  - "@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.308"
  - "@anthropic-ai/claude-agent-sdk-linux-x64@0.3.308"
  - "@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.308"
  - "@anthropic-ai/claude-agent-sdk-win32-x64@0.3.308"
  - "@anthropic-ai/claude-agent-sdk@0.3.308"
  - "@earendil-works/chord@1.2.0"
  - "@earendil-works/pi-agent-core@1.2.0"
  - "@earendil-works/pi-ai@1.2.0"
  - "@earendil-works/pi-coding-agent@1.2.0"
  - "@earendil-works/pi-telemetry@1.2.0"
  - "@earendil-works/pi-tui@1.2.0"
  - "@earendil-works/pi-codemode@1.2.0"
  - "@earendil-works/pi-mcp@1.2.0"
  - "@earendil-works/pi-durable@1.2.0"
  - '@balade/core@0.19.0'
  - '@balade/viewer@0.19.0'

patchedDependencies:
  lucode-starlight@1.0.0: patches/lucode-starlight@1.0.0.patch
