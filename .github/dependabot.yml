version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /
    exclude-paths:
      - apps/docs/**
    schedule:
      interval: weekly
    groups:
      npm:
        patterns:
          - "*"
      # Security updates, which also reach transitive dependencies such as
      # undici, open as one grouped PR instead of one PR per advisory.
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /apps/docs
    schedule:
      interval: weekly
    ignore:
      # TypeDoc 0.28.20 supports TypeScript through 6.0. See #497.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      npm-docs:
        patterns:
          - "*"
      npm-docs-security:
        applies-to: security-updates
        patterns:
          - "*"
