version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Each entry holds back an upgrade that needs a migration; remove it with its issue.
    ignore:
      # Effect 4.0.x stable (#494).
      - dependency-name: "effect"
        versions: [">=4.0.0"]
      - dependency-name: "@effect/*"
        versions: [">=4.0.0"]
      # vitest 5 moves with Effect 4.0.x (#494).
      - dependency-name: "vitest"
        versions: [">=5.0.0"]
      - dependency-name: "@vitest/*"
        versions: [">=5.0.0"]
    groups:
      npm:
        patterns:
          - "*"
      # Security updates, which also reach transitive dependencies such as
      # undici, open as one grouped PR instead of one PR per advisory.
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
