version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # TypeDoc requires TypeScript 6 in apps/docs. See #497.
      # The shared pnpm lockfile requires one root job, so this also limits
      # catalog updates: Dependabot compares against the lowest version (6).
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      npm:
        patterns:
          - "*"
      # Security updates, which also reach transitive dependencies such as
      # undici, open as one grouped PR instead of one PR per advisory.
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
