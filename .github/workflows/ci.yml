name: CI

# A pull request runs on Node 22, the engine's floor. A push to main runs on
# Node 24, the version Release publishes from. A merged pull request has
# already passed on 22, so main does not repeat that leg.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: ${{ github.event_name == 'pull_request' && '22' || '24' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-ci-node${{ env.NODE_VERSION }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-ci-node${{ env.NODE_VERSION }}-
            turbo-${{ runner.os }}-
      # The browser download is keyed by the lockfile, which pins the Playwright version.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm knip
      - run: pnpm build
      - run: pnpm check
      - if: steps.playwright.outputs.cache-hit != 'true'
        run: pnpm --filter @usine/web exec playwright install --with-deps chromium
      - if: steps.playwright.outputs.cache-hit == 'true'
        run: pnpm --filter @usine/web exec playwright install-deps chromium
      - run: pnpm test
