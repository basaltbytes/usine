name: CI

# A pull request runs on Node 22, the engine's floor. A push to main runs on
# Node 24, the version Release publishes from. A merged pull request has
# already passed on 22, so main does not repeat that leg.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: ${{ github.event_name == 'pull_request' && '22' || '24' }}

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true
          cache: pnpm
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: turbo
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-ci-static-node${{ env.NODE_VERSION }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-ci-static-node${{ env.NODE_VERSION }}-
      - run: pnpm install --frozen-lockfile
      - name: Validate changesets
        if: github.event_name == 'pull_request' && hashFiles('.changeset/*.md') != ''
        run: |
          changeset_dir=$(mktemp -d)
          trap 'rm -rf "$changeset_dir"' EXIT
          git archive HEAD | tar -x -C "$changeset_dir"
          ln -s "$PWD/node_modules" "$changeset_dir/node_modules"
          cd "$changeset_dir"
          # Reuse the installed dependencies without reinstalling in the scratch copy.
          pnpm_config_verify_deps_before_run=false pnpm changeset version
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm knip
      - run: pnpm build
      - run: pnpm check
      - run: pnpm test:scripts
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: .turbo
          key: ${{ steps.turbo.outputs.cache-primary-key }}

  test:
    name: test (${{ matrix.leg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: web
            filters: --filter=@usine/web
          - leg: server
            filters: --filter=@usine/server
            args: -- --project=server
          - leg: engine
            filters: --filter=@usine/engine --filter=@usine/orchestrator --filter=@usine/durable
          - leg: rest
            filters: --filter='!@usine/web' --filter='!@usine/server' --filter='!@usine/engine' --filter='!@usine/orchestrator' --filter='!@usine/durable'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true
          cache: pnpm
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: turbo
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-ci-${{ matrix.leg }}-node${{ env.NODE_VERSION }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-ci-${{ matrix.leg }}-node${{ env.NODE_VERSION }}-
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.leg == 'web'
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: matrix.leg == 'web' && steps.playwright.outputs.cache-hit != 'true'
        run: pnpm --filter @usine/web exec playwright install --with-deps chromium
      - if: matrix.leg == 'web' && steps.playwright.outputs.cache-hit == 'true'
        run: pnpm --filter @usine/web exec playwright install-deps chromium
      - run: pnpm turbo run test --concurrency=1 ${{ matrix.filters }} ${{ matrix.args }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: .turbo
          key: ${{ steps.turbo.outputs.cache-primary-key }}

  latency:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true
          cache: pnpm
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: turbo
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-ci-latency-node${{ env.NODE_VERSION }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-ci-latency-node${{ env.NODE_VERSION }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@usine/server
      - run: pnpm --filter @usine/server exec vitest run --project=latency
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: .turbo
          key: ${{ steps.turbo.outputs.cache-primary-key }}

  ci:
    if: always()
    needs: [static, test, latency]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
