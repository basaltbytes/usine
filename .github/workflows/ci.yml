name: CI

# A pull request runs on Node 22, the engine's floor. A push to main runs on
# Node 24, the version Release publishes from. A merged pull request has
# already passed on 22, so main does not repeat that leg.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: ${{ github.event_name == 'pull_request' && '22' || '24' }}

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true
          cache: pnpm
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: turbo
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-ci-static-node${{ env.NODE_VERSION }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-ci-static-node${{ env.NODE_VERSION }}-
      - run: pnpm install --frozen-lockfile
      - name: Validate changesets
        if: github.event_name == 'pull_request' && hashFiles('.changeset/*.md') != ''
        run: |
          changeset_dir=$(mktemp -d)
          trap 'rm -rf "$changeset_dir"' EXIT
          git archive HEAD | tar -x -C "$changeset_dir"
          ln -s "$PWD/node_modules" "$changeset_dir/node_modules"
          cd "$changeset_dir"
          # Reuse the installed dependencies without reinstalling in the scratch copy.
          pnpm_config_verify_deps_before_run=false pnpm changeset version
      - run: pnpm --filter @usine/agents codex:check:upstream
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm knip
      - run: pnpm build
      - run: pnpm check
      - run: pnpm test:scripts
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: .turbo
          key: ${{ steps.turbo.outputs.cache-primary-key }}

  test:
    name: test (${{ matrix.leg }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: web
            # Both browser legs use this container. Its tag matches the Playwright
            # version in apps/web and apps/server, and Renovate updates the tag
            # and digest together.
            container: &playwright-container
              image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
              options: --init
            filters: --filter=@usine/web
          - leg: server
            container: *playwright-container
            filters: --filter=@usine/server
            args: -- --project=server
          - leg: engine
            filters: --filter=@usine/engine --filter=@usine/orchestrator --filter=@usine/durable
          - leg: rest
            filters: --filter='!@usine/web' --filter='!@usine/server' --filter='!@usine/engine' --filter='!@usine/orchestrator' --filter='!@usine/durable'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true
          cache: pnpm
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: turbo
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-ci-${{ matrix.leg }}-node${{ env.NODE_VERSION }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-ci-${{ matrix.leg }}-node${{ env.NODE_VERSION }}-
      - run: pnpm install --frozen-lockfile
      # A cache saved by a pull request run is scoped to that pull request, so the
      # first main run on a new image tag misses and downloads from the mirror
      # with the bounded retries below. Running this workflow on main with
      # workflow_dispatch seeds the main cache.
      # The packages depend on the Ubuntu release that the tag names, so the key
      # leaves out the digest and a digest update reuses the cached packages.
      - name: Name the server test tools cache
        if: matrix.leg == 'server'
        id: server-tools-key
        env:
          IMAGE: ${{ matrix.container.image }}
        run: echo "key=server-test-tools-${IMAGE%@*}-jq-lsof" >> "$GITHUB_OUTPUT"
      - name: Restore server test tools
        if: matrix.leg == 'server'
        id: server-tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/server-test-tools
          key: ${{ steps.server-tools-key.outputs.key }}
      - name: Install server test tools
        if: matrix.leg == 'server'
        timeout-minutes: 6
        env:
          CACHE_HIT: ${{ steps.server-tools.outputs.cache-hit }}
          DEBS: /var/cache/server-test-tools
          APT_SOURCES: /etc/apt/sources.list.d/ubuntu.sources
          APT_OPTIONS: -o Acquire::Retries=3 -o Acquire::http::Timeout=20
        run: |
          if [ "$CACHE_HIT" != true ]; then
            mkdir -p "$DEBS/partial"
            # security.ubuntu.com stalls often, and the main archive serves jq and
            # lsof, so read the image's sources without the security stanza.
            sources=$(mktemp -d)
            awk -v RS= -v ORS='\n\n' '!/(^|\n)URIs:[^\n]*security\.ubuntu\.com/' "$APT_SOURCES" > "$sources/ubuntu.sources"
            # Each call has its own time limit so that three attempts fit in the step timeout.
            apt_get() {
              limit=$1
              shift
              timeout -k 5 "$limit" apt-get $APT_OPTIONS -o Dir::Etc::SourceList=/dev/null -o Dir::Etc::SourceParts="$sources" "$@"
            }
            # apt-get update exits 0 when an index fails to download, so earlier
            # attempts use --error-on=any to retry. It exits 100 on a hard error such
            # as "Mirror sync in progress?" even when the other indexes were fetched,
            # so the last attempt ignores its status and lets the download decide
            # whether jq and lsof resolve.
            for attempt in 1 2 3; do
              strict=--error-on=any
              [ "$attempt" -lt 3 ] || strict=
              if { apt_get 60 $strict update || [ "$attempt" -eq 3 ]; } &&
                apt_get 30 install -y --download-only --no-install-recommends -o Dir::Cache::archives="$DEBS" jq lsof; then
                break
              fi
              [ "$attempt" -lt 3 ] || exit 1
              sleep 10
            done
          fi
          dpkg -i "$DEBS"/*.deb
      - name: Save server test tools
        if: matrix.leg == 'server' && steps.server-tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/server-test-tools
          key: ${{ steps.server-tools.outputs.cache-primary-key }}
      - name: Run tests
        shell: bash
        env:
          # The rest leg runs on the runner itself, whose Docker runs the supervisor sandbox's
          # tests on a real container runtime.
          USINE_SANDBOX_TEST_RUNTIME: ${{ matrix.leg == 'rest' && 'docker' || '' }}
        run: |
          if [ "${{ matrix.leg }}" = server ]; then
            chown -R pwuser:pwuser "$GITHUB_WORKSPACE"
            runuser -u pwuser -- env "PATH=$PATH" pnpm turbo run test --concurrency=1 ${{ matrix.filters }} ${{ matrix.args }}
          else
            pnpm turbo run test --concurrency=1 ${{ matrix.filters }} ${{ matrix.args }}
          fi
        timeout-minutes: 10
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: .turbo
          key: ${{ steps.turbo.outputs.cache-primary-key }}

  latency:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true
          cache: pnpm
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: turbo
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-ci-latency-node${{ env.NODE_VERSION }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-ci-latency-node${{ env.NODE_VERSION }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@usine/server
      - run: pnpm --filter @usine/server exec vitest run --project=latency
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: .turbo
          key: ${{ steps.turbo.outputs.cache-primary-key }}

  ci:
    if: always()
    needs: [static, test, latency]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
