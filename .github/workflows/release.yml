name: Release

# Publishes to npm via OIDC trusted publishing — no NPM_TOKEN secret anywhere
# (same model as basaltbytes/balade). npmjs.com must list this exact workflow
# (basaltbytes/usine, release.yml) as each package's trusted publisher, set by
# hand in each package's settings on npmjs.com (Trusted publisher: GitHub
# Actions, organization basaltbytes, repository usine, workflow release.yml).
# The registry then accepts the runner's OIDC identity. Provenance
# attestations are generated automatically once the repository is public; npm
# skips them while it is private.
#
# Manual until @usine/server has a trusted publisher (#85): every push to main
# failed at the publish step, so the workflow runs only when dispatched.

on:
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # OIDC exchange with the npm registry

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          publish: pnpm changeset:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
