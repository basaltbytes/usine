name: Deploy docs

# Builds apps/docs and uploads it to the usine-docs Worker that serves
# docs.usine.dev. CLOUDFLARE_API_TOKEN is a repository secret created by hand
# for the Basaltbytes Cloudflare account; wrangler reads the account ID from
# apps/docs/wrangler.jsonc.

on:
  push:
    branches: [main]
  workflow_dispatch:

# A push during a deploy waits for it to finish instead of canceling it.
concurrency:
  group: deploy-docs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: pnpm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@usine/docs
      - run: pnpm --filter @usine/docs run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
