name: Deploy docs

# Builds apps/docs and uploads it to the usine-docs Worker that serves
# docs.usine.dev. CLOUDFLARE_API_TOKEN is a repository secret created by hand
# for the Basaltbytes Cloudflare account; wrangler reads the account ID from
# apps/docs/wrangler.jsonc.

on:
  push:
    branches: [main]
  workflow_dispatch:

# A push during a deploy waits for it to finish instead of canceling it.
concurrency:
  group: deploy-docs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@usine/docs
      - run: pnpm --filter @usine/docs run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
