name: Deploy docs

# Builds apps/docs and uploads it to the usine-docs Worker that serves
# docs.usine.dev. CLOUDFLARE_API_TOKEN is a repository secret created by hand
# for the Basaltbytes Cloudflare account; wrangler reads the account ID from
# apps/docs/wrangler.jsonc.

on:
  push:
    branches: [main]
  workflow_dispatch:

# A push during a deploy waits for it to finish instead of canceling it.
concurrency:
  group: deploy-docs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@usine/docs
      - run: pnpm --filter @usine/docs run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
